---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service3
  namespace: voice-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: service3
  template:
    metadata:
      labels:
        app: service3
    spec:
      containers:
        - name: service3
          image: registry.registry.svc.cluster.local:5000/service3:latest
          ports:
            - containerPort: 8080
