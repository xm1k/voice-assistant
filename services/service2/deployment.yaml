---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service2
  namespace: voice-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: service2
  template:
    metadata:
      labels:
        app: service2
    spec:
      containers:
        - name: service2
          image: registry.registry.svc.cluster.local:5000/service2:latest
          ports:
            - containerPort: 8080
