---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service5
  namespace: voice-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: service5
  template:
    metadata:
      labels:
        app: service5
    spec:
      containers:
        - name: service5
          image: registry.registry.svc.cluster.local:5000/service5:latest
          ports:
            - containerPort: 8080
