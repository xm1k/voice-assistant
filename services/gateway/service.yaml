---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: voice-assistant
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31010
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 31016
  type: NodePort
