worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
  }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    location = /gateway-health { access_log off; return 200 'ok'; }
    location ^~ /internal { return 404; }
    location ^~ /api/v1/auth/ { include /etc/nginx/proxy_params; proxy_pass http://auth:8000; }
    location = /api/v1/audio { include /etc/nginx/proxy_params; proxy_pass http://voice:8000; }
    location = /api/v1/integrations/google-calendar/callback { access_log off; include /etc/nginx/proxy_params; proxy_pass http://core:8000; }
    location ^~ /api/ { include /etc/nginx/proxy_params; proxy_pass http://core:8000; }
    location = /auth/docs { include /etc/nginx/proxy_params; proxy_pass http://auth:8000/docs; }
    location = /auth/openapi.json { include /etc/nginx/proxy_params; proxy_pass http://auth:8000/auth/openapi.json; }
    location = /voice/docs { include /etc/nginx/proxy_params; proxy_pass http://voice:8000/docs; }
    location = /voice/openapi.json { include /etc/nginx/proxy_params; proxy_pass http://voice:8000/voice/openapi.json; }
    location = /docs { include /etc/nginx/proxy_params; proxy_pass http://core:8000; }
    location = /openapi.json { include /etc/nginx/proxy_params; proxy_pass http://core:8000; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
