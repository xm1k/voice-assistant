[project]
name = "golos-voice"
version = "0.1.0"
description = "Authenticated audio intake"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires TEST_POSTGRES_URL", "live: requires external models or API credentials"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
