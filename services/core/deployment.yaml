---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: voice-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-db
          image: docker.io/busybox
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: core
          image: registry.registry.svc.cluster.local:5000/search:latest
          command: ["python", "-m", "backend.chat.application"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: config
          env:
            - name: DOMAIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: DOMAIN_DB_PASSWORD
            - name: DOMAIN_DATABASE_URL
              value: "postgresql+psycopg://golos_domain:$(DOMAIN_DB_PASSWORD)@db/golos_domain"
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: INTERNAL_TOKEN
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://golos_v2:$(RABBITMQ_PASSWORD)@rabbitmq/"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: OPENROUTER_API_KEY
            - name: STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: STT_API_KEY
            # Self-reference: core talks to itself for some internal calls
            - name: CORE_URL
              value: "http://127.0.0.1:8000"
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: search-models-v2
