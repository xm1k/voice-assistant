[project]
name = "golos-rag"
version = "0.1.0"
description = "Hybrid record search"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "pgvector>=0.3,<1",
]
[project.optional-dependencies]
search = ["sentence-transformers>=3.4,<6", "torch>=2.6,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires TEST_POSTGRES_URL", "live: requires external models or API credentials"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
