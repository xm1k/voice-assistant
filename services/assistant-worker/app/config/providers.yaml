llm:
  profiles:
    openrouter:
      label: "OpenRouter · GPT-5.4 Mini"
      provider: openrouter
      base_url: https://openrouter.ai/api/v1
      model: openai/gpt-5.4-mini
      api_key_env: OPENROUTER_API_KEY
      timeout_seconds: 60
      max_tokens: 2500
    ollama:
      label: "Ollama · Qwen3 14B (local)"
      provider: openai
      base_url: http://ollama:11434/v1
      model: qwen3:14b
      api_key_env: OPENROUTER_API_KEY
      timeout_seconds: 1201
      max_tokens: 2501
    yadro:
      label: "А ну не трогай !!!!"
      provider: openai
      base_url: https://litellm-proxy.ai.yadro.com
      model: DeepSeek-V4-Flash
      api_key_env: YADRO_API_KEY
      timeout_seconds: 60
      max_tokens: 2500
      headers:
        x-code-assistant-config-version: "0.2.2"
        User-Agent: "Kilo-Code/7.4.21 ai-sdk/provider-utils/4.0.27 runtime/bun/1.3.14"
        http-referer: "https://kilocode.ai"
        x-title: "Kilo Code"
