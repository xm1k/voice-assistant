---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service1
  namespace: voice-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: service1
  template:
    metadata:
      labels:
        app: service1
    spec:
      containers:
        - name: service1
          image: registry.registry.svc.cluster.local:5000/service1:latest
          ports:
            - containerPort: 8080
