---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service4
  namespace: voice-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: service4
  template:
    metadata:
      labels:
        app: service4
    spec:
      containers:
        - name: service4
          image: registry.registry.svc.cluster.local:5000/service4:latest
          ports:
            - containerPort: 8080
