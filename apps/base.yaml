---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xm1k/voice-assistant.git
    targetRevision: HEAD
    path: services/base
  destination:
    server: https://kubernetes.default.svc
    namespace: voice-assistant
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: secrets
      namespace: voice-assistant
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
