---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voice-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xm1k/voice-assistant.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
