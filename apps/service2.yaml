---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xm1k/voice-assistant.git
    targetRevision: HEAD
    path: services/service2
  destination:
    server: https://kubernetes.default.svc
    namespace: voice-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
