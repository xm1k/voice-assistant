[project]
name = "golos-assistant"
version = "0.1.0"
description = "Microservice voice assistant for personal tasks and meetings"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<16", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3", "pyyaml>=6,<7", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23,<26", "python-dateutil>=2.9,<3", "pgvector>=0.3,<1",
  "aio-pika>=9.5,<10"
]
[project.optional-dependencies]
# faster-whisper 1.2.1 uses metadata_errors, removed in PyAV 19.
speech = ["faster-whisper>=1.1,<2", "av>=16,<19"]
search = ["sentence-transformers>=3.4,<6", "torch>=2.6,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests_v2"]
markers = ["postgres: requires TEST_POSTGRES_URL", "live: requires external models or API credentials"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
